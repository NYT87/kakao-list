name: Verify Applications

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-applications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kakao_lists_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KAKAO_SIMULATION_URL: http://127.0.0.1:4499
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kakao_lists_test
      EXTENSION_PUBLIC_KEY: ${{ secrets.EXTENSION_PUBLIC_KEY }}
      VITE_SYNC_SERVER_URL: ${{ vars.VITE_SYNC_SERVER_URL }}
      VITE_KAKAO_REST_API_KEY: ${{ secrets.VITE_KAKAO_REST_API_KEY }}
      VITE_PWA_BASE_URL: ${{ vars.VITE_PWA_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate formatting and lint
        run: pnpm check

      - name: Validate extension package and manifest versions
        run: |
          node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync("apps/extension/package.json")); const manifest = JSON.parse(fs.readFileSync("apps/extension/public/manifest.json")); if (pkg.version !== manifest.version) { throw new Error(`Extension package version ${pkg.version} does not match manifest ${manifest.version}`); }'

      - name: Check types
        run: pnpm typecheck

      - name: Start local Kakao identity fixture
        run: |
          PORT=4499 node postman/mocks/kakao/default.js > /tmp/kakao-fixture.log 2>&1 &
          for attempt in 1 2 3 4 5; do
            if curl --silent http://127.0.0.1:4499/v2/user/me > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kakao-fixture.log
          exit 1

      - name: Test application and PostgreSQL transactions
        run: pnpm test

      - name: Build all applications
        run: pnpm build
